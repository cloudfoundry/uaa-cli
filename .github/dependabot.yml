version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
      time: "11:00"
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    groups:
      ginkgo-gomega:
        patterns:
          - "github.com/onsi/ginkgo*"
          - "github.com/onsi/gomega"
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
      time: "11:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
